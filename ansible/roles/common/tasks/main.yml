---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - unzip
      - software-properties-common
      - default-mysql-client
    state: present

- name: Remove temporary EpicBook risk test file
  file:
    path: /tmp/epicbook-risk-test
    state: absent
