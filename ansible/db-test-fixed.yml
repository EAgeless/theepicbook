---
- name: Test Azure MySQL connection using env directly
  hosts: web
  become: true
  gather_facts: false

  vars:
    db_host: "{{ lookup('ansible.builtin.env', 'EPICBOOK_DB_HOST') }}"
    db_user: "{{ lookup('ansible.builtin.env', 'EPICBOOK_DB_USER') }}"
    db_name: "{{ lookup('ansible.builtin.env', 'EPICBOOK_DB_NAME') }}"
    db_password: "{{ lookup('ansible.builtin.env', 'EPICBOOK_DB_PASSWORD') }}"

  tasks:
    - name: Show variable lengths (safe)
      ansible.builtin.debug:
        msg:
          - "db_host length: {{ db_host | length }}"
          - "db_user: {{ db_user }}"
          - "db_name length: {{ db_name | length }}"
          - "db_password length: {{ db_password | length }}"

    - name: Test MySQL connection with TLS
      ansible.builtin.command:
        argv:
          - mysql
          - -h
          - "{{ db_host }}"
          - -u
          - "{{ db_user }}"
          - --ssl-mode=REQUIRED
          - -D
          - "{{ db_name }}"
          - -e
          - SELECT 1;
      environment:
        MYSQL_PWD: "{{ db_password }}"
      no_log: true
